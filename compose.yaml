services:
  llm-api:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    ports:
      - "${LLM_HOST_PORT:-8080}:8080"
    volumes:
      - "${HOST_MODEL_DIR:-/srv/llm/models}:/models:ro"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --model
      - "${LLM_MODEL_PATH:-/models/model.gguf}"
      - --ctx-size
      - "${LLM_CONTEXT_SIZE:-4096}"
      - --n-gpu-layers
      - "${LLM_GPU_LAYERS:-999}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    depends_on:
      - llm-api
    ports:
      - "${WEBUI_HOST_PORT:-3000}:8080"
    environment:
      - OPENAI_API_BASE_URL=http://llm-api:8080/v1
      - OPENAI_API_KEY=local
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-change-me-before-use}
    volumes:
      - open-webui-data:/app/backend/data

volumes:
  open-webui-data: