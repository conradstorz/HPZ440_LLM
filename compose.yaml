services:
  llm-api:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    ports:
      - "${LLM_HOST_PORT:-8080}:8080"
    volumes:
      - "${HOST_MODEL_DIR:-/srv/llm/models}:/models:ro"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --model
      - "${LLM_MODEL_PATH:-/models/model.gguf}"
      - --ctx-size
      - "${LLM_CONTEXT_SIZE:-4096}"
      - --parallel
      - "${LLM_PARALLEL:-1}"
      - --n-gpu-layers
      - "${LLM_GPU_LAYERS:-999}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    depends_on:
      llm-api:
        condition: service_healthy
      jarvis:
        condition: service_healthy
    ports:
      - "${WEBUI_HOST_PORT:-3000}:8080"
    environment:
      - OPENAI_API_BASE_URLS=http://llm-api:8080/v1;http://jarvis:8090/v1
      - OPENAI_API_KEYS=local;local
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-change-me-before-use}
      # Without this, Open WebUI strips X-OpenWebUI-Chat-Id and every Jarvis turn journals conversation_id: None.
      - ENABLE_FORWARD_USER_INFO_HEADERS=true
    volumes:
      - open-webui-data:/app/backend/data

  jarvis:
    build: ./jarvis
    restart: unless-stopped
    depends_on:
      - llm-api
    ports:
      - "${JARVIS_HOST_PORT:-8090}:8090"
    environment:
      - JARVIS_DATA_DIR=/data
      - JARVIS_LLM_BASE_URL=http://llm-api:8080
      - JARVIS_LLM_MODEL=${LLM_MODEL_PATH:-/models/model.gguf}
      - JARVIS_GMAIL_ACCOUNT=${JARVIS_GMAIL_ACCOUNT:-}
      - JARVIS_GMAIL_QUERY=${JARVIS_GMAIL_QUERY:-in:inbox}
      - JARVIS_MAX_MESSAGES_PER_RUN=${JARVIS_MAX_MESSAGES_PER_RUN:-50}
      - JARVIS_WORKSPACE_AGENT_URL=${JARVIS_WORKSPACE_AGENT_URL:-}
      - JARVIS_MAX_DOCUMENT_BYTES=${JARVIS_MAX_DOCUMENT_BYTES:-5000000}
      - JARVIS_MAX_PDF_PAGES=${JARVIS_MAX_PDF_PAGES:-20}
      # Same source as llama.cpp's --ctx-size above, so the agent's context budget cannot exceed the server's.
      - JARVIS_CONTEXT_TOKENS=${LLM_CONTEXT_SIZE:-4096}
    volumes:
      - "${HOST_JARVIS_DATA_DIR:-/srv/llm/jarvis-data}:/data"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  open-webui-data: